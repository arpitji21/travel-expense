services:
  mysql:
    image: mysql:8.4
    container_name: travel-expense-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travel_expense
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: travel-expense-backend
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      SECRET_KEY: change-me
      JWT_SECRET_KEY: change-me-too
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: travel_expense
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_FOLDER: /app/uploads/receipts
      MAX_CONTENT_LENGTH: 5242880
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - receipt_uploads:/app/uploads/receipts
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: travel-expense-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
  receipt_uploads:
