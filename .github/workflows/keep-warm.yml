name: Keep backend warm

# Render's free tier sleeps the API after ~15 min of inactivity, which makes the
# first sign-in slow. This pings the health endpoint every ~10 minutes so the
# service stays awake. Runs on GitHub's schedule (best-effort; may be delayed).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        run: curl -fsS --max-time 90 https://larkpilot-api.onrender.com/api/health || true
