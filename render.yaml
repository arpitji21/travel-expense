# Render blueprint for the LarkPilot backend (Flask + Postgres).
# In Render: New > Blueprint, point it at this repo. It creates the API
# service and a free Postgres database, wires DATABASE_URL automatically,
# runs migrations + seeds the demo users, then starts gunicorn.
#
# After the first deploy, set CORS_ORIGINS (in the service's Environment tab)
# to your Vercel frontend URL, e.g. https://larkpilot.vercel.app

databases:
  - name: larkpilot-db
    plan: free
    databaseName: larkpilot
    user: larkpilot

services:
  - type: web
    name: larkpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && flask --app run.py seed-users && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: larkpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set this to your Vercel frontend URL after deploying the frontend.
      - key: CORS_ORIGINS
        sync: false
      # Cloudflare R2 — set these (in the service's Environment tab) so uploaded
      # bills persist and the finance department can view them. See DEPLOY.md.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # Email notifications (Gmail SMTP) — emails the salesperson on approve /
      # reimburse. MAIL_PASSWORD is a Gmail App Password. See DEPLOY.md.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
