# Render blueprint for the MediRoute backend (Flask + Postgres).
# In Render: New > Blueprint, point it at this repo. It creates the API
# service and a free Postgres database, wires DATABASE_URL automatically,
# runs migrations + seeds the demo users, then starts gunicorn.
#
# After the first deploy, set CORS_ORIGINS (in the service's Environment tab)
# to your Vercel frontend URL, e.g. https://mediroute.vercel.app

databases:
  - name: mediroute-db
    plan: free
    databaseName: mediroute
    user: mediroute

services:
  - type: web
    name: mediroute-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && flask --app run.py seed-users && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediroute-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set this to your Vercel frontend URL after deploying the frontend.
      - key: CORS_ORIGINS
        sync: false
